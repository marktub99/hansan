name: 혼잡도 수집

on:
  schedule:
    # GitHub 예약 실행은 늦어지거나 빠질 수 있어 하루 네 번 걸어 둔다.
    # 그날 자료가 이미 있으면 수집 프로그램이 바로 끝난다. (시각은 UTC, 괄호는 한국시간)
    - cron: "17 21 * * *"   # 06:17
    - cron: "47 22 * * *"   # 07:47
    - cron: "23 0 * * *"    # 09:23
    - cron: "13 3 * * *"    # 12:13
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python collect.py
      - name: 저장
        run: |
          git config user.name "crowdmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json unmatched.txt
          if [ -f hub.json ]; then git add hub.json; fi
          git diff --cached --quiet || git commit -m "data $(date -u +%F)"
          git push
