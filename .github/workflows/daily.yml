name: 혼잡도 수집

on:
  schedule:
    # GitHub 예약 실행은 늦어지거나 빠질 수 있어 하루 네 번 걸어 둔다.
    # 그날 자료가 이미 있으면 수집 프로그램이 바로 끝난다. (시각은 UTC, 괄호는 한국시간)
    - cron: "17 21 * * *"   # 06:17
    - cron: "47 22 * * *"   # 07:47
    - cron: "23 0 * * *"    # 09:23
    - cron: "13 3 * * *"    # 12:13
  workflow_dispatch:
  # 직접 고치는 두 파일을 저장하면 API 호출 없이 지도에만 바로 반영한다.
  push:
    branches: [main]
    paths: [geo_review.md, overrides.json]

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        if: github.event_name != 'push'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python collect.py
      - name: 직접 고친 내용만 반영
        if: github.event_name == 'push'
        run: python collect.py --review
      - name: 저장
        run: |
          git config user.name "crowdmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json unmatched.txt
          for f in hub.json geo_auto.json geo_review.md; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "data $(date -u +%F)"
          # 실행 중에 사람이 파일을 고쳤으면 그 내용을 살려서 합친 뒤 올린다
          for i in 1 2 3; do
            git pull -q --rebase -X ours origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
