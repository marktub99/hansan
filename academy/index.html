<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>학원 회차 관리</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      min-height: 100vh;
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      padding: 16px 12px 60px 12px;
    }
    h1 {
      font-size: 2.1rem;
      text-align: center;
      margin: 12px 0 20px 0;
      color: #312e81;
      font-weight: 800;
    }
    /* 상단 신규 등록 대형 버튼 */
    .top-add-btn {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 22px 12px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 20px;
      word-break: keep-all;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      margin-bottom: 24px;
    }
    .top-add-btn:active {
      background: #4338ca;
    }
    /* 화면을 큼직하게 채우는 개별 카드 (세로 확장) */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border: 3px solid #e2e8f0;
      min-height: 420px; /* 세로 공간을 넉넉하게 확보 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .form-group {
      margin-bottom: 20px;
      width: 100%;
    }
    label {
      display: block;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #1e293b;
    }
    input, button {
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.4rem;
    }
    input {
      background-color: #fff;
      color: #0f172a;
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      opacity: 0.9;
    }
    .btn-back {
      background-color: #475569;
      color: white;
      width: 100%;
      margin-bottom: 16px;
      font-size: 1.3rem;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
    }
    .btn-secondary {
      background-color: #64748b;
      font-size: 1.3rem;
      padding: 20px;
      border-radius: 14px;
    }
    .btn-danger {
      background-color: #ef4444;
      font-size: 1.1rem;
      padding: 10px 16px;
      width: auto;
      border-radius: 10px;
    }
    .course-card {
      border-left: 20px solid #4f46e5;
    }
    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .course-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 8px;
    }
    .course-sub {
      font-size: 1.3rem;
      color: #475569;
      margin-top: 8px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: bold;
      background: #e0e7ff;
      color: #3730a3;
    }
    .progress-container {
      background: #e2e8f0;
      border-radius: 14px;
      height: 28px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-bar {
      background: #4f46e5;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    /* 버튼 배치를 위아래 또는 균형감 있게 변경하여 찌그러짐 방지 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }
    .btn-group button {
      font-size: 1.45rem;
      padding: 22px;
      border-radius: 14px;
    }
    .log-list {
      font-size: 1.25rem;
      color: #334155;
      margin-top: 20px;
      max-height: 180px;
      overflow-y: auto;
      background: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
    }
    .loading {
      text-align: center;
      padding: 80px;
      font-size: 1.5rem;
      color: #64748b;
    }
    /* 저장 중에는 버튼을 잠근다 */
    #app.busy { pointer-events: none; opacity: 0.55; }
    #busyBar {
      display: none;
      position: fixed;
      left: 0; right: 0; top: 0;
      z-index: 10;
      background: #4f46e5;
      color: #fff;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px;
    }
    /* ---- 휴대폰에서 한 화면에 수강권 2개쯤 보이도록 줄인 크기 ---- */
    .container { padding: 12px 10px 40px 10px !important; }
    h1 { font-size: 1.5rem !important; margin: 6px 0 12px 0 !important; }
    .top-add-btn { font-size: 1.05rem !important; padding: 14px 10px !important; border-radius: 14px !important; margin-bottom: 14px !important; }
    .card { min-height: 0 !important; padding: 16px 14px !important; border-radius: 16px !important; margin-bottom: 14px !important; border-width: 2px !important; }
    .course-card { border-left-width: 10px !important; }
    .course-header { margin-bottom: 4px !important; }
    .status-badge { font-size: 0.9rem !important; padding: 4px 10px !important; }
    .course-title { font-size: 1.45rem !important; margin-top: 4px !important; }
    .course-sub { font-size: 0.9rem !important; margin-top: 2px !important; }
    .btn-danger { font-size: 0.85rem !important; padding: 7px 12px !important; }
    .count-row { font-size: 1.15rem !important; margin-top: 12px !important; }
    .progress-container { height: 14px !important; margin: 8px 0 12px 0 !important; }
    .btn-group { flex-direction: row !important; gap: 8px !important; margin-top: 0 !important; }
    .btn-group button { font-size: 1.1rem !important; padding: 15px 8px !important; border-radius: 12px !important; flex: 2; }
    .btn-group button.btn-secondary { font-size: 0.95rem !important; flex: 1; }
    .log-list { font-size: 0.9rem !important; margin-top: 10px !important; max-height: 96px !important; padding: 10px 12px !important; border-radius: 10px !important; }
    .log-list div { margin-bottom: 3px !important; }
    .remain-warn { font-size: 0.95rem !important; padding: 8px 10px !important; }
    label { font-size: 1.05rem !important; margin-bottom: 6px !important; }
    input { font-size: 1.1rem !important; padding: 13px !important; border-width: 2px !important; }
    .form-group { margin-bottom: 14px !important; }
    .btn-back { font-size: 1rem !important; padding: 13px !important; }
    .remain-warn {
      background: #fef3c7;
      color: #92400e;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .remain-warn.done { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
  </style>
</head>
<body>
  <div id="busyBar">저장 중… ⏳</div>
  <div class="container">
    <h1>📚 학원 회차 관리</h1>
    <div id="app" style="width: 100%; flex: 1; display: flex; flex-direction: column;">
      <div class="loading">데이터 불러오는 중...</div>
    </div>
    <div style="text-align:center; margin-top:18px;"><a href="#" onclick="resetSetup(); return false;" style="color:#94a3b8; font-size:0.8rem;">연결 주소 다시 설정</a></div>
  </div>

  <script>
    // ================= 설치형 앱 전용: 구글 시트와 연결하는 부분 =================
    // 연결 주소(Apps Script 웹앱 주소)는 이 파일에 적지 않고, 처음 한 번 입력받아 이 휴대폰에만 저장한다.
    // 이 파일은 누구나 볼 수 있는 곳(GitHub)에 있으므로 주소를 여기에 적으면 안 된다.
    const API_KEY_NAME = 'academy_api_url';
    function apiUrl() {
      try { return localStorage.getItem(API_KEY_NAME) || ''; } catch (e) { return ''; }
    }
    function validApiUrl(u) {
      return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u);
    }
    // 설치 링크(…/academy/#u=연결주소)로 열면 주소를 자동으로 저장한다
    (function () {
      const m = location.hash.match(/^#u=(.+)$/);
      if (!m) return;
      const u = decodeURIComponent(m[1]).trim();
      if (validApiUrl(u)) { try { localStorage.setItem(API_KEY_NAME, u); } catch (e) {} }
      history.replaceState(null, '', location.pathname);
    })();

    function callApi(fn, args) {
      return fetch(apiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 구글 웹앱은 이 형식이어야 다른 사이트에서 호출된다
        body: JSON.stringify({ fn: fn, args: args }),
        redirect: 'follow'
      }).then(function (r) {
        if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
        return r.json();
      }, function () {
        throw new Error('연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');
      }).then(function (out) {
        if (!out || !out.ok) throw new Error((out && out.error) || '알 수 없는 오류');
        return out.data;
      });
    }
    // 기존 화면 코드가 쓰는 google.script.run 과 같은 모양으로 감싼다 (화면 코드를 그대로 쓰기 위해)
    function makeRunner(ok, fail) {
      return new Proxy({}, { get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { return makeRunner(f, fail); };
        if (name === 'withFailureHandler') return function (f) { return makeRunner(ok, f); };
        return function () {
          callApi(name, Array.prototype.slice.call(arguments)).then(
            function (d) { if (ok) ok(d); },
            function (e) { if (fail) fail(e); });
        };
      } });
    }
    window.google = { script: { run: makeRunner(null, null) } };

    function showSetup(msg) {
      document.getElementById('app').innerHTML =
        '<div class="card" style="min-height:auto;">' +
        '<div style="font-size:1.25rem; font-weight:bold; margin-bottom:10px; color:#1e293b;">🔗 처음 한 번만 연결하기</div>' +
        '<div style="font-size:0.95rem; color:#475569; margin-bottom:14px; line-height:1.5;">구글 Apps Script 에서 복사한 <b>웹 앱 주소</b>를 붙여넣어 주세요. 이 휴대폰에만 저장됩니다.</div>' +
        (msg ? '<div class="remain-warn done">' + esc(msg) + '</div>' : '') +
        '<div class="form-group"><input type="url" id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
        '<button onclick="saveSetup()" style="padding:15px; font-size:1.1rem;">연결하기</button></div>';
    }
    function saveSetup() {
      const u = document.getElementById('apiInput').value.trim();
      if (!validApiUrl(u)) { showSetup('주소 형식이 맞지 않습니다. https://script.google.com/macros/s/ 로 시작하고 /exec 로 끝나야 합니다.'); return; }
      try { localStorage.setItem(API_KEY_NAME, u); } catch (e) { showSetup('이 브라우저에 저장할 수 없습니다 (시크릿 모드인지 확인).'); return; }
      document.getElementById('app').innerHTML = '<div class="loading">연결 확인 중...</div>';
      callApi('getAppData', []).then(function (data) {
        appData = data || []; loaded = true; currentView = 'home'; render();
      }, function (e) {
        try { localStorage.removeItem(API_KEY_NAME); } catch (x) {}
        showSetup('연결에 실패했습니다: ' + e.message + ' — 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
      });
    }
    function resetSetup() {
      if (!confirm("이 휴대폰에 저장된 연결 주소를 지우고 다시 설정할까요?\n(출석 기록은 지워지지 않습니다)")) return;
      try { localStorage.removeItem(API_KEY_NAME); } catch (e) {}
      appData = []; loaded = false; showSetup('');
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    // ================= 여기부터는 Apps Script 화면과 같은 코드 =================

    let appData = [];
    let currentView = 'home';
    let busy = false;        // 서버에 저장하는 동안 버튼을 잠근다 (두 번 눌림 방지)
    let loaded = false;

    window.onload = function() {
      if (!apiUrl()) showSetup(''); else loadData(false);
    };
    // 다른 앱에 갔다가 돌아오면 최신 기록을 다시 불러온다 (다른 사람이 그 사이 출석 체크했을 수 있음)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && loaded && !busy && currentView === 'home') loadData(true);
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function loadData(quiet) {
      google.script.run
        .withSuccessHandler(function(data) {
          if (busy) return;
          appData = data || [];
          loaded = true;
          if (!quiet || currentView === 'home') render();
        })
        .withFailureHandler(function(err) {
          if (quiet) return;
          document.getElementById('app').innerHTML = '<div class="card" style="text-align:center; color:red; font-size:1.3rem; min-height:auto;">로드 실패: ' + esc(err.message) +
            '<br><button onclick="loadData(false)" style="margin-top:20px;">🔄 다시 시도</button></div>';
        })
        .getAppData();
    }

    // 서버에서 한 건만 고치고, 고친 뒤의 최신 전체 목록을 받아 화면을 다시 그린다.
    function change(fnName, args, after) {
      if (busy) return;
      busy = true;
      setBusy(true);
      const runner = google.script.run
        .withSuccessHandler(function(data) {
          busy = false;
          appData = data || [];
          if (after) after();
          render();
          setBusy(false);
        })
        .withFailureHandler(function(err) {
          busy = false;
          setBusy(false);
          alert("저장 실패: " + err.message + "\n최신 기록을 다시 불러옵니다.");
          loadData(false);
        });
      runner[fnName].apply(runner, args);
    }

    function setBusy(on) {
      document.getElementById('app').classList.toggle('busy', on);
      document.getElementById('busyBar').style.display = on ? 'block' : 'none';
    }

    function changeView(view) {
      if (busy) return;
      currentView = view;
      render();
      window.scrollTo(0, 0);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        const parts = dateStr.split('-');
        return `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
      }
      const d = new Date(dateStr);
      if (!isNaN(d.getTime())) {
        return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
      }
      return dateStr;
    }

    function todayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    function addCourse() {
      const childName = document.getElementById('childName').value.trim();
      const courseName = document.getElementById('courseName').value.trim();
      const startDate = document.getElementById('startDate').value;
      const totalSessions = parseInt(document.getElementById('totalSessions').value);

      if (!childName || !courseName || !startDate || !totalSessions || totalSessions < 1) {
        alert("모든 항목을 입력해주세요.");
        return;
      }

      change('addCourse', [{
        childName: childName,
        courseName: courseName,
        startDate: startDate,
        totalSessions: totalSessions
      }], function() { currentView = 'home'; window.scrollTo(0, 0); });
    }

    function checkIn(id) {
      const course = appData.find(c => c.id === id);
      if (!course) return;

      if (course.attendanceLogs.length >= course.totalSessions) {
        alert("이미 모든 회차를 소진했습니다!");
        return;
      }

      const logs = course.attendanceLogs;
      const today = todayStr();
      if (logs.length && String(logs[logs.length - 1]).slice(0, 10) === today) {
        if (!confirm("오늘 이미 출석 체크한 기록이 있습니다.\n한 번 더 체크할까요?")) return;
      }

      const now = new Date();
      const dateString = `${today} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      change('checkIn', [id, dateString]);
    }

    function cancelCheckIn(id) {
      const course = appData.find(c => c.id === id);
      if (!course || course.attendanceLogs.length === 0) return;

      const last = course.attendanceLogs[course.attendanceLogs.length - 1];
      if (confirm("마지막 출석 기록을 취소하시겠습니까?\n(" + last + ")")) {
        change('cancelCheckIn', [id, last]);
      }
    }

    function deleteCard(id) {
      if (confirm("정말 이 수강권 정보를 삭제하시겠습니까?")) {
        change('deleteCourse', [id]);
      }
    }

    function render() {
      const container = document.getElementById('app');

      if (currentView === 'add') {
        container.innerHTML = `
          <button class="btn-back" onclick="changeView('home')">⬅️ 목록으로 돌아가기</button>
          <div class="card" style="min-height: auto;">
            <div style="font-size: 1.7rem; font-weight: bold; margin-bottom: 24px; color: #1e293b;">➕ 수강권 신규 등록</div>
            <div class="form-group">
              <label>아이 이름</label>
              <input type="text" id="childName" placeholder="예: 첫째, 둘째">
            </div>
            <div class="form-group">
              <label>학원 및 과목명</label>
              <input type="text" id="courseName" placeholder="예: 수학학원, 미술">
            </div>
            <div class="form-group">
              <label>등록일(시작일)</label>
              <input type="date" id="startDate" value="${todayStr()}">
            </div>
            <div class="form-group">
              <label>총 회차</label>
              <input type="number" id="totalSessions" value="12" min="1">
            </div>
            <button onclick="addCourse()" style="padding:22px; font-size:1.5rem; margin-top:10px;">수강권 등록 완료</button>
          </div>
        `;
      } else {
        let html = `<button class="top-add-btn" onclick="changeView('add')">➕ 새로운 학원/수강권 등록하기</button>`;

        if (appData.length === 0) {
          html += '<div class="card" style="text-align:center; color:#64748b; padding:80px; font-size:1.4rem; min-height:auto;">등록된 수강권이 없습니다.<br>위의 버튼을 눌러 등록해주세요!</div>';
        } else {
          appData.forEach(course => {
            const usedCount = course.attendanceLogs.length;
            const remainCount = course.totalSessions - usedCount;
            const percent = Math.min(100, Math.round((usedCount / course.totalSessions) * 100));
            const formattedDate = formatDate(course.startDate);

            let logsHtml = course.attendanceLogs.length > 0
              ? course.attendanceLogs.map((log, idx) => `<div style="margin-bottom:8px;"><b>${idx+1}회차:</b> ${esc(log)}</div>`).join('')
              : '출석 기록 없음';

            const warnHtml = remainCount <= 0
              ? '<div class="remain-warn done">🔔 회차를 모두 소진했습니다 — 재등록 확인</div>'
              : remainCount <= 2
              ? `<div class="remain-warn">⚠️ 잔여 ${remainCount}회 — 곧 재등록 시기입니다</div>`
              : '';

            html += `
              <div class="card course-card">
                <div>
                  <div class="course-header">
                    <div>
                      <span class="status-badge">${esc(course.childName)}</span>
                      <div class="course-title">${esc(course.courseName)}</div>
                      <div class="course-sub">시작일: ${esc(formattedDate)}</div>
                    </div>
                    <button class="btn-danger" onclick="deleteCard('${esc(course.id)}')">삭제</button>
                  </div>

                  <div class="count-row" style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.5rem; margin-top:24px;">
                    <span>출석 <span style="color:#4f46e5;">${usedCount}회</span> / 잔여 <span style="color:#059669;">${remainCount}회</span></span>
                    <span>${percent}%</span>
                  </div>
                  <div class="progress-container">
                    <div class="progress-bar" style="width: ${percent}%;"></div>
                  </div>
                  ${warnHtml}
                </div>

                <div>
                  <div class="btn-group">
                    <button onclick="checkIn('${esc(course.id)}')" ${usedCount >= course.totalSessions ? 'disabled style="background:#cbd5e1;"' : ''}>✅ 출석 체크 (+1)</button>
                    <button class="btn-secondary" onclick="cancelCheckIn('${esc(course.id)}')">출석 취소</button>
                  </div>

                  <div class="log-list">
                    <div style="font-weight:bold; margin-bottom:8px;">출석 기록:</div>
                    ${logsHtml}
                  </div>
                </div>
              </div>
            `;
          });
        }

        container.innerHTML = html;
      }
    }
  </script>
</body>
</html>
